<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRON MAYHEM — Arena Combat</title>
<meta name="description" content="Original browser 3D vehicular arena-combat game. Playable entry point.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23120d08'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E🔥%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #070605; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .fallback { position: fixed; inset: auto 0 0 0; padding: 8px; text-align: center;
    font: 14px monospace; color: #b9b2a4; background: rgba(0,0,0,.6); display: none; }
</style>
</head>
<body>
<iframe id="game" src="./twisted-arena/index.html" title="IRON MAYHEM — playable 3D arena combat"
  allow="autoplay; fullscreen" allowfullscreen></iframe>
<p class="fallback" id="fallback">If the game does not load here, open it directly:
  <a href="./twisted-arena/index.html" style="color:#ffb300">./twisted-arena/index.html</a></p>
<noscript><p style="color:#f5efe2;font-family:sans-serif;padding:2rem">IRON MAYHEM needs JavaScript + WebGL.
  Open <a href="./twisted-arena/index.html">./twisted-arena/index.html</a>.</p></noscript>
<script>
  // If the embedded game fails to boot (e.g. blocked frame), surface the direct link.
  setTimeout(function () {
    try {
      var w = document.getElementById('game').contentWindow;
      if (!w || !w.__game) document.getElementById('fallback').style.display = 'block';
    } catch (e) { document.getElementById('fallback').style.display = 'block'; }
  }, 20000);
</script>
</body>
</html>
