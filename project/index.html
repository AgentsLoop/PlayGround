<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo — Minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <main class="app">
    <header class="app-header">
      <div class="brand">
        <div class="logo">✓</div>
        <div>
          <h1>Todo</h1>
          <p class="subtitle">Stay focused, get it done.</p>
        </div>
      </div>
      <div class="header-meta">
        <span id="dateLabel" class="date-label"></span>
      </div>
    </header>

    <section class="card composer">
      <div class="input-wrap">
        <span class="input-icon">＋</span>
        <input id="todoInput" type="text" placeholder="What needs to be done?" autocomplete="off" maxlength="120" aria-label="New todo">
      </div>
      <button id="addBtn" class="btn btn-primary" aria-label="Add todo">Add</button>
    </section>

    <section class="card list-card">
      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="Filter todos">
          <a href="#/" data-filter="all" class="filter-btn active" role="tab" aria-selected="true">All</a>
          <a href="#/active" data-filter="active" class="filter-btn" role="tab" aria-selected="false">Active</a>
          <a href="#/completed" data-filter="completed" class="filter-btn" role="tab" aria-selected="false">Completed</a>
        </div>
        <div class="toolbar-right">
          <span id="counter" class="counter">0 left</span>
        </div>
      </div>

      <div class="toggle-all-row" id="toggleAllRow">
        <input type="checkbox" id="toggleAll" aria-label="Toggle all todos">
        <label for="toggleAll">Mark all as complete</label>
      </div>

      <ul id="todoList" class="todo-list" aria-live="polite"></ul>

      <div id="emptyState" class="empty-state">
        <div class="empty-illust">✦</div>
        <h3 id="emptyTitle">No todos yet</h3>
        <p id="emptyDesc">Add your first task above and start your day.</p>
      </div>

      <footer class="list-footer">
        <span id="totalLabel" class="total-label"></span>
        <button id="clearCompleted" class="btn btn-ghost">Clear completed</button>
      </footer>
    </section>

    <p class="hint">Tip: double-click a todo to edit · press <kbd>Enter</kbd> to save · <kbd>Esc</kbd> to cancel</p>
  </main>

<script src="./app.js"></script>
</body>
</html>
