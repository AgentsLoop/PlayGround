name: OpenCode
run-name: "OpenCode #${{ github.event.issue.number || inputs.issue_number }}${{ github.event.issue.title && format(' — {0}', github.event.issue.title) || '' }}"

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue to run
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  issues: write
  actions: write

concurrency:
  group: opencode-issue-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'OpenCode')
    uses: AgentsLoop/OhMyGithub/.github/workflows/opencode-prepare.yml@a0f59ed4819fa338740ae5bc81519c3e22c0cf50
    with:
      runtime_ref: a0f59ed4819fa338740ae5bc81519c3e22c0cf50
  opencode:
    needs: prepare
    if: needs.prepare.outputs.approved == 'true'
    uses: AgentsLoop/OhMyGithub/.github/workflows/opencode-reusable.yml@a0f59ed4819fa338740ae5bc81519c3e22c0cf50
    permissions:
      id-token: write
      contents: write
      issues: write
      actions: read
    with:
      runtime_ref: a0f59ed4819fa338740ae5bc81519c3e22c0cf50
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      request: ${{ needs.prepare.outputs.request }}
      issue_title: ${{ needs.prepare.outputs.issue_title }}
      labels_json: ${{ needs.prepare.outputs.labels_json }}
      sender: ${{ needs.prepare.outputs.sender }}
      target_ref: ${{ needs.prepare.outputs.target_ref }}
      target_sha: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit
