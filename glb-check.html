<!doctype html><html><head><meta charset="utf-8"/><style>html,body{margin:0;height:100%;background:#181c22;color:#fff;font-family:monospace}#info{position:fixed;top:8px;left:8px;background:#000a;padding:8px;border-radius:8px;font-size:12px;white-space:pre-wrap}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="info">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x181c22);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2));
const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(5,10,7); scene.add(d);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 500);
try {
  const gltf = await new GLTFLoader().loadAsync('/models/sportscar.glb');
  const root = new THREE.Group(); root.add(gltf.scene); scene.add(root);
  scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  let tris = 0; root.traverse(o=>{ if(o.isMesh){ tris += o.geometry.index ? o.geometry.index.count/3 : o.geometry.attributes.position.count/3; }});
  const maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(center.x + maxDim*1.6, center.y + maxDim*0.9, center.z + maxDim*1.6);
  camera.lookAt(center);
  document.getElementById('info').textContent =
    `MESHES rendered | size ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} | tris ~${Math.round(tris)} | forward-axis TBD`;
  document.body.dataset.compareState = 'ready';
  renderer.setAnimationLoop(()=>renderer.render(scene, camera));
} catch(e){ document.getElementById('info').textContent = 'LOAD ERROR: ' + e.message; }
</script></body></html>
